<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOBBY R2B 利用サポートチャット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky: #2E8FC4;
    --sky-deep: #1F6E9C;
    --sun: #F5B942;
    --sun-soft: #FCE8B8;
    --coral: #EF6C4A;
    --coral-dark: #C6522F;
    --paper: #FFFDF7;
    --ink: #22303B;
    --ink-soft: #62727D;
    --line: #E3DCC9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Zen Kaku Gothic New', sans-serif;
    background: var(--sun-soft);
    color: var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background: var(--paper);
    display:flex;
    flex-direction:column;
    box-shadow: 0 0 40px rgba(43,59,46,0.12);
  }

  header{
    background: var(--sky);
    color: var(--sun-soft);
    padding: 20px 0 0;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    right:-40px; top:-50px;
    width:160px; height:160px;
    border-radius:50%;
    background: var(--sky-deep);
    opacity:0.45;
  }
  .header-inner{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:8px;
    padding: 2px 16px 0 20px;
    position:relative;
  }
  .header-text{
    max-width:58%;
    padding-bottom:20px;
  }
  .header-hero{
    flex:0 0 auto;
    width:160px;
    height:auto;
    display:block;
    object-fit:contain;
    object-position:bottom right;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.18));
    position:relative;
    bottom:-4px;
  }
  .eyebrow{
    font-size:12px;
    color: #D9EEFA;
    letter-spacing: 0.02em;
    margin:0 0 4px;
    position:relative;
  }
  h1{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size: 22px;
    font-weight:700;
    margin:0 0 8px;
    position:relative;
    line-height:1.3;
  }
  .sub{
    font-size:12.5px;
    color:#EAF5FB;
    margin:0;
    line-height:1.6;
    position:relative;
  }

  .chips{
    display:flex;
    gap:8px;
    padding:14px 16px;
    overflow-x:auto;
    background: #FDEDE6;
    border-bottom:1px solid var(--line);
  }
  .chip{
    flex:0 0 auto;
    background: var(--paper);
    border:1px solid var(--line);
    color: var(--sky);
    font-size:12.5px;
    padding:8px 13px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition: background .15s, transform .1s;
  }
  .chip:hover{ background:#fff; }
  .chip:active{ transform: scale(0.97); }

  .chat{
    flex:1;
    padding:20px 16px;
    display:flex;
    flex-direction:column;
    gap:14px;
    overflow-y:auto;
  }
  .msg{
    max-width:85%;
    padding:12px 14px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.75;
    white-space:pre-wrap;
  }
  .msg.bot{
    align-self:flex-start;
    background: var(--sun-soft);
    border: 1px solid var(--line);
    border-top-left-radius:4px;
    color: var(--ink);
  }
  .msg.user{
    align-self:flex-end;
    background: var(--coral);
    color: #fff;
    border-top-right-radius:4px;
  }
  .msg.bot.thinking{
    color: var(--ink-soft);
    font-style: italic;
  }
  .msg.error{
    align-self:flex-start;
    background:#F6E4DD;
    border:1px solid #E3B7A4;
    color:#7A3319;
  }

  .inputbar{
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:12px 14px;
    border-top:1px solid var(--line);
    background: var(--paper);
  }
  textarea{
    flex:1;
    resize:none;
    border:1px solid var(--line);
    border-radius:14px;
    padding:11px 14px;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.5;
    max-height:120px;
    background:#fff;
    color: var(--ink);
  }
  textarea:focus{ outline:2px solid var(--sky-deep); outline-offset:-1px; }
  button.send{
    background: var(--sky);
    color:#fff;
    border:none;
    width:42px;
    height:42px;
    border-radius:50%;
    cursor:pointer;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .15s;
  }
  button.send:hover{ background: var(--sky-deep); }
  button.send:disabled{ background:#B9B2A3; cursor:not-allowed; }

  .footnote{
    font-size:11px;
    color: var(--ink-soft);
    text-align:center;
    padding:8px 16px 14px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-inner">
      <div class="header-text">
        <h1>8686号専用チャットAI</h1>
        <p class="sub">設備の使い方や困りごとをAIがお答えします。</p>
      </div>
      <img class="header-hero" src="mobby-hero.png" alt="MOBBY R2B 8686号車">
    </div>
  </header>

  <div class="chips" id="chips">
    <div class="chip">ベッドは何か所ある？サイズは？</div>
    <div class="chip">エアコンは一晩中つけっぱなしにできる？</div>
    <div class="chip">車内モニター(Screen AI)の音声操作は？</div>
    <div class="chip">車両の寸法・最小回転半径は？</div>
    <div class="chip">外部電源の繋ぎ方は？</div>
  </div>

  <div class="chat" id="chat">
    <div class="msg bot">やあ、旅は順調ですか？MOBBY R2Bの設備やカーナビ(OTTOCAST Screen AI)のことなら何でも聞いてください。上のボタンからも選べます。</div>
  </div>

  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="質問を入力…"></textarea>
    <button class="send" id="sendBtn" aria-label="送信">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="white" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </button>
  </div>
  <p class="footnote">このチャットはプロトタイプです。ガス・電装系のトラブルなど安全に関わる場合は、必ずオーナーへ直接ご連絡ください。</p>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const chipsEl = document.getElementById('chips');

let history = [];

function addMessage(role, text, extraClass){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot') + (extraClass ? ' ' + extraClass : '');
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function sendMessage(text){
  if(!text.trim()) return;
  addMessage('user', text);
  history.push({role:'user', content: text});
  inputEl.value = '';
  autoResize();
  sendBtn.disabled = true;

  const thinkingEl = addMessage('bot', '考え中…', 'thinking');

  try{
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await response.json();

    thinkingEl.remove();

    if(!response.ok){
      addMessage('bot', data.error || '通信エラーが発生しました。時間をおいて再度お試しください。', 'error');
      return;
    }

    addMessage('bot', data.answer);
    history.push({role:'assistant', content: data.answer});
  }catch(err){
    thinkingEl.remove();
    addMessage('bot', '通信エラーが発生しました。時間をおいて再度お試しください。', 'error');
    console.error(err);
  }finally{
    sendBtn.disabled = false;
  }
}

function autoResize(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}

let isComposing = false;
inputEl.addEventListener('compositionstart', () => { isComposing = true; });
inputEl.addEventListener('compositionend', () => { isComposing = false; });

inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey && !isComposing && e.keyCode !== 229){
    e.preventDefault();
    sendMessage(inputEl.value);
  }
});
sendBtn.addEventListener('click', ()=> sendMessage(inputEl.value));

chipsEl.addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(chip) sendMessage(chip.textContent);
});
</script>
</body>
</html>
